name: Bug Report
description: Report a bug or camera compatibility issue in Inksight
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Inksight Version
      description: Shown in the top-left header pill (e.g. v1.0.0)
      placeholder: "v1.0.0"
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera Brand & Model (if applicable)
      placeholder: "e.g. Reolink RLC-810A / Dahua IPC-T5442T-ZE"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the issue and steps to reproduce.
    validations:
      required: true
