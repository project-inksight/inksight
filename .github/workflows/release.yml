name: Build Windows Installer Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build Versioned Inksight Setup.exe Installer
        shell: pwsh
        run: ./Build-Exe-Installer.ps1

      - name: Run TypeScript & AI Tracking Tests
        run: |
          npm run typecheck
          npm test

      - name: Upload Release Assets on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Inksight-Setup-v*.exe
            release/Inksight-Setup.exe
            release/Inksight-Setup-v*.exe.sha256.txt
